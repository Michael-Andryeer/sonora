name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dist: dist:linux
            files: dist/*.AppImage
          - os: windows-latest
            dist: dist:win
            files: dist/*.exe

    name: Build installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch yt-dlp and ffmpeg
        run: npm run fetch:binaries

      - name: Build installer
        run: npm run ${{ matrix.dist }} -- --publish never

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
